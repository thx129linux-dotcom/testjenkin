version: "3.8"

services:
  # Base de données MySQL
  mysql:
    image: mysql:8.0
    container_name: drupal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-drupal}
      MYSQL_USER: ${DB_USER:-drupal}
      MYSQL_PASSWORD: ${DB_PASSWORD:-drupal_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      timeout: 3s
      retries: 5
      interval: 10s

  # Application Drupal avec PHP-FPM
  drupal:
    build:
      context: .
      dockerfile: Dockerfile.drupal
    container_name: drupal-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-drupal}
      DB_USER: ${DB_USER:-drupal}
      DB_PASSWORD: ${DB_PASSWORD:-drupal_password}
      DRUPAL_HASH_SALT: ${DRUPAL_HASH_SALT:-change_me}
      DRUPAL_ENV: ${DRUPAL_ENV:-develop}
      PHP_MEMORY_LIMIT: 512M
      PHP_MAX_UPLOAD_SIZE: 256M
    volumes:
      - .:/var/www/html:cached
      - drupal_files:/var/www/html/web/sites/default/files
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      timeout: 3s
      retries: 5
      interval: 10s

  # Serveur Web Nginx
  nginx:
    image: nginx:alpine
    container_name: drupal-nginx
    restart: unless-stopped
    depends_on:
      - drupal
    volumes:
      - .:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-8081}:80"
      - "443:443"
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      timeout: 3s
      retries: 5
      interval: 10s

  # Jenkins CI/CD
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "${JENKINS_PORT:-8084}:8080"
      - "${JENKINS_AGENTS_PORT:-50000}:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/var/jenkins_workspace:ro
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Duser.timezone=UTC"
      JENKINS_ARGS: "--argumentsRealm.passwd.admin=${JENKINS_PASSWORD:-admin} --argumentsRealm.roles.admin=admin"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      timeout: 5s
      retries: 5
      interval: 10s

  # Redis - Cache (optionnel)
  redis:
    image: redis:7-alpine
    container_name: drupal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5
      interval: 10s

  # MailHog - Serveur de mail pour développement
  mailhog:
    image: mailhog/mailhog:latest
    container_name: drupal-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025"]
      timeout: 3s
      retries: 5
      interval: 10s

volumes:
  mysql_data:
    driver: local
  drupal_files:
    driver: local
  jenkins_home:
    driver: local

networks:
  default:
    name: drupal-network
