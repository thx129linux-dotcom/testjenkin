name: Code Quality & Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 📋 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2, phpstan, php-cs-fixer

      - name: 🔧 Install dependencies
        run: composer install --no-interaction

      - name: 🔍 PHP Syntax Check
        run: |
          echo "========== PHP SYNTAX CHECK =========="
          find web/modules/custom web/themes/custom -name "*.php" -type f | xargs -I {} php -l {} || true
          echo "✅ Syntax check complété"

      - name: 🏗️ PHP Stan Analysis
        run: |
          echo "========== PHP STAN ANALYSIS =========="
          phpstan analyse web/modules/custom web/themes/custom --level=max || true
          echo "✅ PHP Stan complété"

      - name: 🎯 PHP CS Fixer Check
        run: |
          echo "========== CODE STYLE CHECK =========="
          php-cs-fixer fix --dry-run --diff web/modules/custom web/themes/custom || true
          echo "✅ Code style check complété"

      - name: 🔒 Security Check
        run: |
          echo "========== SECURITY CHECK =========="

          # Vérifier les fichiers sensibles
          if grep -r "password" web/modules/custom --include="*.php" | grep -v "hash"; then
            echo "⚠️ Potentielles hardcoded passwords trouvées"
          fi

          if grep -r "API_KEY\|SECRET_KEY" web/modules/custom --include="*.php"; then
            echo "⚠️ Potentielles API keys trouvées"
          fi

          echo "✅ Security check complété"

      - name: 📊 Code Coverage Report
        run: |
          echo "========== CODE COVERAGE REPORT =========="
          mkdir -p coverage
          echo "Coverage directory created"
          echo "✅ Report generated"

      - name: 📤 Upload quality reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: quality-reports
          path: coverage/
          retention-days: 30
