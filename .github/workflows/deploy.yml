name: Deploy to Production

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 📋 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: 📦 Install production dependencies
        run: |
          set -euo pipefail
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-dev \
            --optimize-autoloader

      - name: ✅ Validate deploy configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_IP: ${{ secrets.DEPLOY_IP }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail

          missing=0

          DEPLOY_TARGET="${DEPLOY_HOST:-${DEPLOY_IP:-${SERVER_IP:-}}}"

          if [ -z "$DEPLOY_TARGET" ]; then
            echo "❌ Secret manquant: configurez DEPLOY_HOST, DEPLOY_IP ou SERVER_IP"
            missing=1
          else
            echo "✅ Cible de déploiement détectée: $DEPLOY_TARGET"
          fi

          for var in DEPLOY_USER DEPLOY_PATH DEPLOY_KEY; do
            if [ -z "${!var}" ]; then
              echo "❌ Secret manquant: $var"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Ajoutez les secrets requis dans GitHub > Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: 📋 Setup SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_IP: ${{ secrets.DEPLOY_IP }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          set -euo pipefail
          DEPLOY_TARGET="${DEPLOY_HOST:-${DEPLOY_IP:-${SERVER_IP:-}}}"

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_TARGET" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 📤 Deploy to Server
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_IP: ${{ secrets.DEPLOY_IP }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
        run: |
          set -euo pipefail
          DEPLOY_TARGET="${DEPLOY_HOST:-${DEPLOY_IP:-${SERVER_IP:-}}}"

          echo "========== DÉPLOIEMENT =========="
          echo "Vers: ${DEPLOY_TARGET}"
          echo "Path: ${DEPLOY_PATH}"
          echo "Environnement: ${ENVIRONMENT}"

          bash scripts/deploy.sh \
            "${ENVIRONMENT}" \
            "${DEPLOY_TARGET}" \
            "${DEPLOY_USER}" \
            "${DEPLOY_PATH}" \
            "$HOME/.ssh/deploy_key"

          echo "✅ Déploiement complété"

      - name: 🔄 Post-Deploy Health Check
        run: |
          HEALTH_URL=${{ secrets.HEALTH_CHECK_URL }}

          if [ -z "$HEALTH_URL" ]; then
            echo "⚠️ HEALTH_CHECK_URL non configuré"
            exit 0
          fi

          echo "========== HEALTH CHECK =========="

          for i in {1..5}; do
            if curl -f "${HEALTH_URL}" > /dev/null 2>&1; then
              echo "✅ Health check réussi"
              exit 0
            fi
            echo "Tentative $i/5..."
            sleep 10
          done

          echo "❌ Health check échoué après 5 tentatives"
          exit 1

      - name: 📢 Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Déploiement réussi vers ${{ github.event.inputs.environment || 'production' }}!"
          else
            echo "❌ Déploiement échoué!"
            exit 1
          fi
