services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: jenkins

    restart: unless-stopped

    ports:
      - "8084:8084"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"

volumes:
  jenkins_home:
